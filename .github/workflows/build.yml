name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install NDK 29 (needed by the engine)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.13846066" "platforms;android-35" > /dev/null
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Check APK requests no SMS permissions (Play Protect blocks those)
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          "$AAPT2" dump permissions "$APK" | tee perms.txt
          if grep -E "SMS|MMS|WAP_PUSH|NOTIFICATION_LISTENER|BIND_ACCESSIBILITY" perms.txt | grep -v BROADCAST; then
            echo "::error::APK requests permissions that make Play Protect block install"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: egizak-debug-apk
          path: app/build/outputs/apk/debug/*.apk
